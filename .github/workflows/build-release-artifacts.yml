# Build release artifacts from signed tags.
# Signing will be added later via SignPath Foundation.

name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      verify_previous_msi_upgrade:
        description: Test the published v0.6.10 MSI upgrade on the hosted runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.release_identity.outputs.tag }}
      tag_object: ${{ steps.release_identity.outputs.tag_object }}
      commit: ${{ steps.release_identity.outputs.commit }}
      tree: ${{ steps.release_identity.outputs.tree }}

    env:
      VERSION: ''
      DIST_DIR: dist

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed tag and freeze release identity
        id: release_identity
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_REVISION: ${{ github.sha }}
          EVENT_REF: ${{ github.event.ref }}
          EVENT_CREATED: ${{ github.event.created }}
          EVENT_DELETED: ${{ github.event.deleted }}
          EVENT_FORCED: ${{ github.event.forced }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve checked-out commit.' }
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve checked-out source tree.' }
          $tag = ''
          $tagObject = ''

          if ($env:EVENT_NAME -eq 'push' -and $env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:REF_NAME
            if ($env:EVENT_REF -cne "refs/tags/$tag" -or $env:EVENT_CREATED -ne 'true' -or
                $env:EVENT_DELETED -eq 'true' -or $env:EVENT_FORCED -eq 'true') {
              throw 'Release publication requires a new, non-force tag creation event.'
            }
            $signerPath = Join-Path $env:RUNNER_TEMP 'release-allowed-signers'
            $trustedSigners = & git show 'refs/remotes/origin/main:.github/release-allowed-signers'
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the trusted release signer list from origin/main.' }
            if (-not $trustedSigners -or [string]::IsNullOrWhiteSpace(($trustedSigners -join ''))) {
              throw 'The trusted release signer list from origin/main is empty.'
            }
            Set-Content -LiteralPath $signerPath -Value $trustedSigners -Encoding utf8NoBOM
            if (-not (Test-Path -LiteralPath $signerPath) -or (Get-Item -LiteralPath $signerPath).Length -eq 0) {
              throw 'Could not materialize the trusted release signer list.'
            }
            $verified = & .\packaging\verify-release-tag.ps1 -TagRef "refs/tags/$tag" -ExpectedRevision $env:EXPECTED_REVISION -AllowedSignersPath $signerPath
            if (-not $?) { throw 'Signed release tag verification failed.' }
            foreach ($field in 'Tag', 'TagObject', 'Commit', 'Tree') {
              if (-not $verified.PSObject.Properties[$field]) { throw "Release tag verifier omitted $field." }
            }
            if ($verified.Tag -cne "refs/tags/$tag" -or $verified.Commit -cne $commit -or $verified.Tree -cne $tree) {
              throw 'Verified release identity does not match the frozen checkout.'
            }
            $tagObject = [string]$verified.TagObject
            $remoteLine = & git ls-remote --exit-code origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0 -or $remoteLine -cne "$tagObject`trefs/tags/$tag") {
              throw 'The authoritative remote tag does not match the frozen tag object.'
            }
            [xml]$project = Get-Content -LiteralPath WindowThumbWall.csproj
            if ([string]$project.Project.PropertyGroup.Version -cne $tag.Substring(1)) {
              throw 'The project package version does not match the release tag.'
            }
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "tag_object=$tagObject" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "tree=$tree" >> $env:GITHUB_OUTPUT
          Write-Host "Frozen checkout commit $commit tree $tree; tag '$tag'."

      - name: Determine version
        env:
          VERIFIED_TAG: ${{ steps.release_identity.outputs.tag }}
        run: |
          $ver = if ($env:VERIFIED_TAG) { $env:VERIFIED_TAG } else { 'dev' }
          "VERSION=$ver" | Out-File $env:GITHUB_ENV -Append
          Write-Host "VERSION=$ver"

      - name: Create output directory
        run: New-Item -ItemType Directory -Force -Path $env:DIST_DIR | Out-Null

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore application and test dependencies
        shell: pwsh
        run: |
          $nugetRoot = Join-Path $env:RUNNER_TEMP 'window-thumb-wall-nuget'
          $env:NUGET_PACKAGES = Join-Path $nugetRoot 'packages'
          $env:NUGET_HTTP_CACHE_PATH = Join-Path $nugetRoot 'http-cache'
          "NUGET_PACKAGES=$env:NUGET_PACKAGES" >> $env:GITHUB_ENV
          "NUGET_HTTP_CACHE_PATH=$env:NUGET_HTTP_CACHE_PATH" >> $env:GITHUB_ENV

          dotnet restore .\WindowThumbWall.Tests\WindowThumbWall.Tests.csproj --configfile .\NuGet.Config --verbosity normal
          if ($LASTEXITCODE -ne 0) { throw 'Dependency restore failed.' }

      - name: Build application and test project
        shell: pwsh
        run: |
          dotnet build .\WindowThumbWall.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed.' }
          dotnet build .\WindowThumbWall.Tests\WindowThumbWall.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Test project build failed.' }
          dotnet test .\WindowThumbWall.Tests\WindowThumbWall.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Test project tests failed.' }

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix --version

      - name: Add WiX UI extension
        run: |
          wix extension add -acceptEula wix7 -g "WixToolset.UI.wixext/7.0.0"

      - name: Build architectures
        run: |
          $ErrorActionPreference = 'Stop'
          $architectures = @("x64", "arm64")
          foreach ($arch in $architectures) {
            $runtime = "win-$arch"
            Write-Host ">> Building for $runtime..." -ForegroundColor Cyan

            # ── Publish ──────────────────────────────────────────────
            dotnet publish WindowThumbWall.csproj `
              -c Release -r $runtime --self-contained `
              -p:PublishSingleFile=false `
              -o "publish-$arch"
            if ($LASTEXITCODE -ne 0) { throw "Application publish failed for $runtime" }

            # ── ZIP artifact ─────────────────────────────────────────
            Get-ChildItem "publish-$arch" -Filter *.pdb -Recurse | Remove-Item -Force
            $zipPath = "$env:DIST_DIR\WindowThumbWall-$env:VERSION-win-$arch.zip"
            Compress-Archive -Path "publish-$arch\*" -DestinationPath $zipPath -CompressionLevel Optimal
            if (-not (Test-Path -LiteralPath $zipPath) -or (Get-Item -LiteralPath $zipPath).Length -eq 0) {
              throw "ZIP creation failed for $runtime"
            }

            # ── MSI artifact (WiX v7) ────────────────────────────────
            # We need to publish again for MSI because it might need different settings or just a clean dir
            dotnet publish WindowThumbWall.csproj `
              -c Release -r $runtime --self-contained `
              -p:PublishSingleFile=false `
              -o "publish-msi-$arch"
            if ($LASTEXITCODE -ne 0) { throw "MSI publish failed for $runtime" }

            $publishMsiDir = (Resolve-Path "publish-msi-$arch").Path

            $plainVersion = $env:VERSION -replace '^v', ''
            if ($plainVersion -match '^\d+\.\d+\.\d+$') {
              $versionParts = $plainVersion.Split('.')
              $msiProductVersion = "$($versionParts[0]).$($versionParts[1]).$($versionParts[2]).0"
            } else {
              $msiProductVersion = (Select-Xml -Path WindowThumbWall.csproj -XPath '/Project/PropertyGroup/AssemblyVersion').Node.InnerText
            }

            $wixOutput = & wix build packaging\WindowThumbWall.wxs `
              -acceptEula wix7 `
              -arch $arch `
              -ext WixToolset.UI.wixext `
              -d PublishDir="$publishMsiDir" `
              -d ProductVersion="$msiProductVersion" `
              -o "$env:DIST_DIR\WindowThumbWall-$env:VERSION-win-$arch.msi" 2>&1
            $wixOutput | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "WiX MSI build failed for $runtime" }
            if ($wixOutput -match 'WIX8600|WIX8601') { throw "WiX harvested no MSI payload files for $runtime" }
            & .\packaging\verify-msi-payload.ps1 -MsiPath "$env:DIST_DIR\WindowThumbWall-$env:VERSION-win-$arch.msi"

            # ── MSIX artifact ───────────────────────────────────────
            dotnet publish WindowThumbWall.csproj `
              -c Release -r $runtime --self-contained `
              -p:PublishSingleFile=false `
              -o "publish-msix-$arch"
            if ($LASTEXITCODE -ne 0) { throw "MSIX publish failed for $runtime" }

            Copy-Item packaging\AppxManifest.xml "publish-msix-$arch" -Force
            Copy-Item packaging\Assets "publish-msix-$arch\Assets" -Recurse -Force

            # Patch MSIX manifest version and architecture
            $plainVersion = $env:VERSION -replace '^v', ''
            $manifestPath = "publish-msix-$arch\AppxManifest.xml"
            [xml]$xml = Get-Content $manifestPath
            $resourceLanguages = @($xml.Package.Resources.Resource | ForEach-Object { [string]$_.Language })
            if ($resourceLanguages.Count -eq 0 -or $resourceLanguages -contains '' -or $resourceLanguages -contains 'x-generate') {
              throw 'The standalone MSIX manifest requires concrete resource languages before MakeAppx runs.'
            }

            if ($plainVersion -match '^\d+\.\d+\.\d+$') {
              $versionParts = $plainVersion.Split('.')
              $packageVersion = "$($versionParts[0]).$($versionParts[1]).$($versionParts[2]).0"
              $xml.Package.Identity.Version = $packageVersion
              Write-Host "Patched MSIX manifest version to $packageVersion"
            }

            $xml.Package.Identity.ProcessorArchitecture = $arch
            $xml.Save((Resolve-Path $manifestPath))
            Write-Host "Patched MSIX manifest architecture to $arch"

            $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
                        Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $makeappx) {
              Write-Error "makeappx.exe not found. Ensure Windows SDK is installed."
              exit 1
            }
            & $makeappx pack /d "publish-msix-$arch" /p "$env:DIST_DIR\WindowThumbWall-$env:VERSION-win-$arch.msix" /o
            if ($LASTEXITCODE -ne 0) { throw "makeappx failed for $runtime" }
            $msixPath = "$env:DIST_DIR\WindowThumbWall-$env:VERSION-win-$arch.msix"
            if (-not (Test-Path -LiteralPath $msixPath) -or (Get-Item -LiteralPath $msixPath).Length -eq 0) {
              throw "MSIX creation failed for $runtime"
            }
          }

      - name: Verify x64 MSI lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msiPath = (Resolve-Path "$env:DIST_DIR\WindowThumbWall-$env:VERSION-win-x64.msi").Path
          $installLog = Join-Path $env:DIST_DIR 'msi-install.log'
          $uninstallLog = Join-Path $env:DIST_DIR 'msi-uninstall.log'
          $installedExe = 'C:\Program Files\WindowThumbWall\WindowThumbWall.exe'
          $installed = $false
          $plainVersion = $env:VERSION -replace '^v', ''
          if ($plainVersion -match '^\d+\.\d+\.\d+$') {
            $versionParts = $plainVersion.Split('.')
            $expectedFileVersion = "$($versionParts[0]).$($versionParts[1]).$($versionParts[2]).0"
          } else {
            $expectedFileVersion = (Select-Xml -Path WindowThumbWall.csproj -XPath '/Project/PropertyGroup/AssemblyVersion').Node.InnerText
          }

          try {
            $installProcess = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', $msiPath, '/qn', '/norestart', '/l*v', $installLog) -PassThru -Wait
            if ($installProcess.ExitCode -ne 0) { throw "MSI installation failed with exit code $($installProcess.ExitCode)" }
            $installed = $true

            if (-not (Test-Path -LiteralPath $installedExe)) { throw "Installed executable not found: $installedExe" }
            $installedVersion = (Get-Item -LiteralPath $installedExe).VersionInfo.FileVersion
            if ($installedVersion -ne $expectedFileVersion) { throw "Installed executable version was $installedVersion, expected $expectedFileVersion" }

            $app = Start-Process -FilePath $installedExe -PassThru
            Start-Sleep -Seconds 3
            $app.Refresh()
            if ($app.HasExited) { throw "Installed application exited during smoke test with code $($app.ExitCode)" }
            if ($app.CloseMainWindow()) {
              if (-not $app.WaitForExit(10000)) { throw 'Installed application did not exit after a clean close request' }
            } elseif (-not [Environment]::UserInteractive) {
              # GitHub-hosted runners have no interactive window station; clean up the proven smoke-test process.
              Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
              if (-not $app.WaitForExit(10000)) { throw 'Installed application did not exit after headless smoke-test cleanup' }
            } else {
              throw 'Installed application did not accept a clean close request'
            }
          }
          finally {
            if ($installed) {
              $uninstallProcess = Start-Process -FilePath msiexec.exe -ArgumentList @('/x', $msiPath, '/qn', '/norestart', '/l*v', $uninstallLog) -PassThru -Wait
              if ($uninstallProcess.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($uninstallProcess.ExitCode)" }
              if (Test-Path -LiteralPath $installedExe) { throw "Installed executable remains after uninstall: $installedExe" }
            }
          }

      - name: Verify v0.6.10 MSI major upgrade preserves user state
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name != 'v0.6.10') || (github.event_name == 'workflow_dispatch' && inputs.verify_previous_msi_upgrade)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $previousMsi = Join-Path $env:RUNNER_TEMP 'WindowThumbWall-v0.6.10-win-x64.msi'
          $currentMsi = (Resolve-Path -LiteralPath "$env:DIST_DIR\WindowThumbWall-$env:VERSION-win-x64.msi").Path
          $expectedFileVersion = (Select-Xml -Path WindowThumbWall.csproj -XPath '/Project/PropertyGroup/FileVersion').Node.InnerText
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            # Bake the target version into the isolated candidate without editing version files.
            $candidateMsi = Join-Path $env:RUNNER_TEMP 'WindowThumbWall-upgrade-candidate-win-x64.msi'
            $publishDir = Join-Path $env:RUNNER_TEMP 'window-thumb-wall-upgrade-candidate-x64'
            $expectedFileVersion = '0.6.11.0'
            dotnet publish WindowThumbWall.csproj -c Release -r win-x64 --self-contained -o "$publishDir" `
              -p:PublishSingleFile=false -p:Version=0.6.11 -p:AssemblyVersion=0.6.11.0 -p:FileVersion=0.6.11.0
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish the development upgrade fixture.' }
            wix build packaging\WindowThumbWall.wxs -acceptEula wix7 -arch x64 -ext WixToolset.UI.wixext `
              -d PublishDir="$publishDir" -d ProductVersion=0.6.11.0 -o "$candidateMsi"
            if ($LASTEXITCODE -ne 0) { throw 'Could not build the development upgrade fixture.' }
            & .\packaging\verify-msi-payload.ps1 -MsiPath $candidateMsi
            $currentMsi = $candidateMsi
          }

          $previousUri = 'https://github.com/tsuchim/window-thumb-wall/releases/download/v0.6.10/WindowThumbWall-v0.6.10-win-x64.msi'
          Invoke-WebRequest -Uri $previousUri -OutFile $previousMsi
          & .\packaging\test-msi-major-upgrade.ps1 `
            -PreviousMsi $previousMsi `
            -CurrentMsi $currentMsi `
            -ExpectedVersion $expectedFileVersion `
            -LogDirectory $env:DIST_DIR

      # ── Generate Metadata ─────────────────────────────────────
      - name: Generate release metadata
        run: |
          $ErrorActionPreference = 'Stop'
          .\packaging\generate-release-metadata.ps1 -Version "$env:VERSION" -OutputDir "$env:DIST_DIR"
          @('release-notes.md', 'store-listing-ja.md', 'store-listing-en.md', 'store-whats-new-ja.md', 'store-whats-new-en.md') | ForEach-Object {
            $metadataPath = Join-Path $env:DIST_DIR $_
            if (-not (Test-Path -LiteralPath $metadataPath) -or (Get-Item -LiteralPath $metadataPath).Length -eq 0) {
              throw "Expected release metadata was not generated: $_"
            }
          }

      - name: Write release provenance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_identity.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ steps.release_identity.outputs.tag_object }}
          RELEASE_COMMIT: ${{ steps.release_identity.outputs.commit }}
          RELEASE_TREE: ${{ steps.release_identity.outputs.tree }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dotnetVersion = (& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not record the .NET SDK version.' }
          $wixVersion = (& wix --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not record the WiX version.' }
          $toolchain = "runner=$env:ImageOS/$env:ImageVersion;dotnet=$dotnetVersion;wix=$wixVersion"
          .\packaging\release-artifact-manifest.ps1 -Mode Write -Directory $env:DIST_DIR -Tag $env:RELEASE_TAG -TagObject $env:RELEASE_TAG_OBJECT -Commit $env:RELEASE_COMMIT -Tree $env:RELEASE_TREE -Toolchain $toolchain
          if (-not (Test-Path -LiteralPath (Join-Path $env:DIST_DIR 'release-provenance.json'))) { throw 'Release provenance was not written.' }

      - name: Upload MSI lifecycle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-lifecycle-logs
          path: |
            ${{ env.DIST_DIR }}/msi-install.log
            ${{ env.DIST_DIR }}/msi-uninstall.log
            ${{ env.DIST_DIR }}/msi-upgrade-*.log
          if-no-files-found: warn

      # ── Upload artifacts ───────────────────────────────────────
      # These unsigned artifacts will be signed via SignPath in a future step.
      - name: Upload unsigned tag artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-artifacts
          path: |
            ${{ env.DIST_DIR }}/WindowThumbWall-${{ env.VERSION }}-win-*.zip
            ${{ env.DIST_DIR }}/WindowThumbWall-${{ env.VERSION }}-win-*.msi
            ${{ env.DIST_DIR }}/WindowThumbWall-${{ env.VERSION }}-win-*.msix
            ${{ env.DIST_DIR }}/release-notes.md
            ${{ env.DIST_DIR }}/store-listing-*.md
            ${{ env.DIST_DIR }}/store-whats-new-*.md
            ${{ env.DIST_DIR }}/release-provenance.json
          if-no-files-found: error

      - name: Upload unsigned development artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-artifacts
          path: |
            ${{ env.DIST_DIR }}/WindowThumbWall-${{ env.VERSION }}-win-*.zip
            ${{ env.DIST_DIR }}/WindowThumbWall-${{ env.VERSION }}-win-*.msi
            ${{ env.DIST_DIR }}/WindowThumbWall-${{ env.VERSION }}-win-*.msix
            ${{ env.DIST_DIR }}/release-notes.md
            ${{ env.DIST_DIR }}/store-listing-*.md
            ${{ env.DIST_DIR }}/store-whats-new-*.md
          if-no-files-found: error

  store:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-to-store.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      tag_object: ${{ needs.build.outputs.tag_object }}
      commit: ${{ needs.build.outputs.commit }}
      tree: ${{ needs.build.outputs.tree }}
    secrets:
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      SELLER_ID: ${{ secrets.SELLER_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, store]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DIST_DIR: dist

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download unsigned artifacts
        uses: actions/download-artifact@v4
        with:
          name: unsigned-artifacts
          path: ${{ env.DIST_DIR }}

      - name: Verify release identity, remote tag and provenance
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_TREE: ${{ needs.build.outputs.tree }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signerPath = Join-Path $env:RUNNER_TEMP 'release-allowed-signers'
          $trustedSigners = & git show 'refs/remotes/origin/main:.github/release-allowed-signers'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the trusted release signer list from origin/main.' }
          if (-not $trustedSigners -or [string]::IsNullOrWhiteSpace(($trustedSigners -join ''))) { throw 'Trusted release signer list is empty.' }
          Set-Content -LiteralPath $signerPath -Value $trustedSigners -Encoding utf8NoBOM
          if (-not (Test-Path -LiteralPath $signerPath) -or (Get-Item -LiteralPath $signerPath).Length -eq 0) { throw 'Trusted release signer list was not materialized.' }
          $verified = & .\packaging\verify-release-tag.ps1 -TagRef "refs/tags/$env:RELEASE_TAG" -ExpectedRevision $env:RELEASE_COMMIT -ExpectedTagObject $env:RELEASE_TAG_OBJECT -ExpectedTree $env:RELEASE_TREE -AllowedSignersPath $signerPath
          if (-not $?) { throw 'Signed release tag verification failed.' }
          $remoteLine = & git ls-remote origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the authoritative remote tag ref.' }
          $localTagObject = (& git rev-parse "refs/tags/$env:RELEASE_TAG").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the local named release tag.' }
          $remoteFields = @($remoteLine -split '\s+' | Where-Object { $_ })
          if ($remoteFields.Count -ne 2 -or $remoteFields[1] -cne "refs/tags/$env:RELEASE_TAG" -or $remoteFields[0] -cne $env:RELEASE_TAG_OBJECT -or $localTagObject -cne $env:RELEASE_TAG_OBJECT) {
            throw 'The local and authoritative remote tag object do not match the frozen release tag.'
          }
          .\packaging\release-artifact-manifest.ps1 -Mode Verify -Directory $env:DIST_DIR -Tag $env:RELEASE_TAG -TagObject $env:RELEASE_TAG_OBJECT -Commit $env:RELEASE_COMMIT -Tree $env:RELEASE_TREE

      - name: Reconcile verified GitHub draft and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_TREE: ${{ needs.build.outputs.tree }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\packaging\reconcile-github-release.ps1 `
            -ApiBase $env:GITHUB_API_URL `
            -Repository $env:GITHUB_REPOSITORY `
            -Tag $env:RELEASE_TAG `
            -TagObject $env:RELEASE_TAG_OBJECT `
            -Commit $env:RELEASE_COMMIT `
            -Tree $env:RELEASE_TREE `
            -Directory $env:DIST_DIR `
            -Token $env:GH_TOKEN
