# Reusable Store publishing job. The caller gates this on a successful tag build.

name: Release to Microsoft Store

on:
  workflow_call:
    inputs:
      tag:
        description: Verified release tag name
        required: true
        type: string
      tag_object:
        description: Frozen annotated tag object ID
        required: true
        type: string
      commit:
        description: Frozen release commit ID
        required: true
        type: string
      tree:
        description: Frozen release source tree ID
        required: true
        type: string
    secrets:
      AZURE_AD_TENANT_ID:
        required: true
      SELLER_ID:
        required: true
      AZURE_AD_APPLICATION_CLIENT_ID:
        required: true
      AZURE_AD_APPLICATION_SECRET:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: windows-2025-vs2026
    env:
      STORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_TAG_OBJECT: ${{ inputs.tag_object }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_TREE: ${{ inputs.tree }}

    steps:
      - name: Check earlier Store attempts before retry
        if: github.run_attempt > 1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{Authorization="Bearer $env:GH_TOKEN"}
          for ($attempt = 1; $attempt -lt [int]$env:GITHUB_RUN_ATTEMPT; $attempt++) {
            $attemptUrl = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/attempts/$attempt/jobs?per_page=100"
            $prior = Invoke-RestMethod -Uri $attemptUrl -Headers $headers
            if ($prior.total_count -gt @($prior.jobs).Count) { throw 'The earlier release attempt could not be reconciled.' }
            $started = @($prior.jobs.steps | Where-Object {
              $_.name -in 'MSStore Create Draft Submission', 'MSStore Commit Submission' -and
                $_.started_at -and $_.conclusion -ne 'skipped'
            })
            if ($started.Count -gt 0) {
              throw 'An earlier run may have created or committed a Store submission. Reconcile Store state before retrying.'
            }
          }

      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify frozen checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve checked-out commit.' }
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve checked-out tree.' }
          if ($commit -cne $env:RELEASE_COMMIT -or $tree -cne $env:RELEASE_TREE) {
            throw 'The Store checkout does not match the frozen release commit and tree.'
          }
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'The Store release tag must use vX.Y.Z.'
          }

      - name: Check Store product configuration
        id: prereq
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $val = $env:STORE_PRODUCT_ID
          if (-not $val) { throw 'MSSTORE_PRODUCT_ID variable is missing from repository variables.' }
          $normalized = $val.ToUpperInvariant()
          if ($val -ne $normalized) { Write-Host "Normalizing STORE_PRODUCT_ID to uppercase: $normalized" }
          "store_product_id=$normalized" >> $env:GITHUB_OUTPUT

      - name: Derive Store version from release tag
        id: versioning
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = $env:RELEASE_TAG.Substring(1).Split('.')
          $storeVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          Write-Host "Store manifest version: $storeVersion"
          "version=$storeVersion" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "vswhere failed with exit code $LASTEXITCODE." }
          if (-not $msbuild) { throw 'MSBuild.exe not found via vswhere.' }
          "msbuild_path=$msbuild" >> $env:GITHUB_OUTPUT
          Write-Host "Using MSBuild: $msbuild"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore WindowThumbWall.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Store build restore failed.' }

      - name: Patch Package.appxmanifest version
        shell: pwsh
        env:
          STORE_VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = 'packaging/Package.appxmanifest'
          $xml = New-Object System.Xml.XmlDocument
          $xml.PreserveWhitespace = $true
          $xml.Load($manifestPath)
          $namespaceUri = $xml.DocumentElement.NamespaceURI
          $namespaceManager = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $namespaceManager.AddNamespace('appx', $namespaceUri)
          $identityNode = $xml.SelectSingleNode('/appx:Package/appx:Identity', $namespaceManager)
          if (-not $identityNode) { throw "Identity element not found in $manifestPath" }
          $identityNode.SetAttribute('Name', 'tsuchim.WindowThumbWall')
          $identityNode.SetAttribute('Publisher', 'CN=F6D2388F-2B1D-4A95-BC62-2D5CDADC605B')
          $identityNode.SetAttribute('Version', $env:STORE_VERSION)
          $identityNode.SetAttribute('ProcessorArchitecture', 'neutral')
          $publisherNode = $xml.SelectSingleNode('/appx:Package/appx:Properties/appx:PublisherDisplayName', $namespaceManager)
          if (-not $publisherNode) { throw "PublisherDisplayName element not found in $manifestPath" }
          $publisherNode.InnerText = 'tsuchim'
          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
          $settings.Indent = $true
          $settings.NewLineChars = "`n"
          $settings.NewLineHandling = [System.Xml.NewLineHandling]::Replace
          $writer = [System.Xml.XmlWriter]::Create($manifestPath, $settings)
          try { $xml.Save($writer) } finally { $writer.Dispose() }
          Write-Host "Patched Store package manifest to $env:STORE_VERSION."

      - name: Build Store Package
        shell: pwsh
        env:
          MSBUILD_PATH: ${{ steps.msbuild.outputs.msbuild_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $PWD 'packaging\AppPackages'
          if (Test-Path -LiteralPath $packageDir) { Remove-Item -LiteralPath $packageDir -Recurse -Force }
          & $env:MSBUILD_PATH packaging\WindowThumbWall.Package.wapproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Always `
            '/p:AppxBundlePlatforms=x64|ARM64' `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageSigningEnabled=false `
            /p:GenerateAppInstallerFile=false `
            "/p:AppxPackageDir=$packageDir\"
          if ($LASTEXITCODE -ne 0) { throw "MSBuild packaging failed with exit code $LASTEXITCODE." }

      - name: Verify Store upload package and record its SHA256
        id: store_package
        shell: pwsh
        env:
          EXPECTED_STORE_VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packageDir = Join-Path $PWD 'packaging\AppPackages'
          $packages = @(Get-ChildItem -LiteralPath $packageDir -Filter '*.msixupload' -File -Recurse | Where-Object { $_.Length -gt 0 })
          if ($packages.Count -ne 1) { throw "Expected exactly one nonempty .msixupload from this build; found $($packages.Count)." }
          $package = $packages[0]
          $outer = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $bundleEntry = @($outer.Entries | Where-Object { $_.FullName -match '\.(?:appx|msix)bundle$' })
            if ($bundleEntry.Count -ne 1) { throw "Expected one app bundle in the .msixupload; found $($bundleEntry.Count)." }
            $bundleStream = $bundleEntry[0].Open()
            try {
              $bundleMemoryStream = [System.IO.MemoryStream]::new()
              try {
                $bundleStream.CopyTo($bundleMemoryStream)
                $bundleMemoryStream.Position = 0
                $bundle = [System.IO.Compression.ZipArchive]::new($bundleMemoryStream, [System.IO.Compression.ZipArchiveMode]::Read, $true)
                try {
                  $manifestEntry = $bundle.GetEntry('AppxMetadata/AppxBundleManifest.xml')
                  if (-not $manifestEntry) { throw 'The current Store build bundle has no AppxBundleManifest.xml.' }
                  $manifestStream = $manifestEntry.Open()
                  try {
                    $reader = [System.IO.StreamReader]::new($manifestStream)
                    try { [xml]$bundleManifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
                  } finally { $manifestStream.Dispose() }
                } finally { $bundle.Dispose() }
              } finally { $bundleMemoryStream.Dispose() }
            } finally { $bundleStream.Dispose() }
          } finally { $outer.Dispose() }
          $identity = $bundleManifest.SelectSingleNode('/*[local-name()="Bundle"]/*[local-name()="Identity"]')
          if (!$identity -or $identity.GetAttribute('Version') -cne $env:EXPECTED_STORE_VERSION) {
            throw 'The Store bundle version does not match the verified release.'
          }
          $architectures = @($bundleManifest.SelectNodes('//*[local-name()="Package"][@Type="application"]') | ForEach-Object { $_.GetAttribute('Architecture').ToLowerInvariant() } | Sort-Object -Unique)
          foreach ($requiredArchitecture in 'x64', 'arm64') {
            if ($architectures -notcontains $requiredArchitecture) { throw "Current Store build bundle is missing $requiredArchitecture architecture evidence; found: $($architectures -join ', ')." }
          }
          $sha256 = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "package_sha256=$sha256" >> $env:GITHUB_OUTPUT
          "Store package SHA256: $sha256" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Store package: $($package.FullName)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Bundle architectures: $($architectures -join ', ')" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Setup Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.2
        with:
          version: v0.3.9

      - name: Reverify signed tag and remote tag before Store submission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signerPath = Join-Path $env:RUNNER_TEMP 'release-allowed-signers'
          $trustedSigners = & git show 'refs/remotes/origin/main:.github/release-allowed-signers'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read trusted signers from origin/main.' }
          if (-not $trustedSigners -or [string]::IsNullOrWhiteSpace(($trustedSigners -join ''))) { throw 'Trusted signer list is empty.' }
          Set-Content -LiteralPath $signerPath -Value $trustedSigners -Encoding utf8NoBOM
          if (-not (Test-Path -LiteralPath $signerPath) -or (Get-Item -LiteralPath $signerPath).Length -eq 0) { throw 'Trusted signer list was not materialized.' }
          $verified = & .\packaging\verify-release-tag.ps1 -TagRef "refs/tags/$env:RELEASE_TAG" -ExpectedRevision $env:RELEASE_COMMIT -ExpectedTagObject $env:RELEASE_TAG_OBJECT -ExpectedTree $env:RELEASE_TREE -AllowedSignersPath $signerPath
          if (-not $?) { throw 'Signed release tag verification failed.' }
          $remoteLine = & git ls-remote origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the authoritative remote tag ref.' }
          $localTagObject = (& git rev-parse "refs/tags/$env:RELEASE_TAG").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the local named release tag.' }
          $remoteFields = @($remoteLine -split '\s+' | Where-Object { $_ })
          if ($remoteFields.Count -ne 2 -or $remoteFields[1] -cne "refs/tags/$env:RELEASE_TAG" -or $remoteFields[0] -cne $env:RELEASE_TAG_OBJECT -or $localTagObject -cne $env:RELEASE_TAG_OBJECT) {
            throw 'The local and authoritative remote release tag object do not match the frozen tag.'
          }

      - name: MSStore Create Draft Submission
        shell: pwsh
        env:
          PACKAGE_SHA256: ${{ steps.store_package.outputs.package_sha256 }}
          STORE_PRODUCT_ID_NORMALIZED: ${{ steps.prereq.outputs.store_product_id }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $PWD 'packaging\AppPackages'
          $packages = @(Get-ChildItem -LiteralPath $packageDir -Filter '*.msixupload' -File -Recurse | Where-Object { $_.Length -gt 0 })
          if ($packages.Count -ne 1) { throw "Expected exactly one nonempty .msixupload before submission; found $($packages.Count)." }
          $package = $packages[0]
          $actualSha256 = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -cne $env:PACKAGE_SHA256) { throw 'The Store package changed after architecture verification.' }
          msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed with exit code $LASTEXITCODE." }
          msstore publish $package.FullName -id $env:STORE_PRODUCT_ID_NORMALIZED --noCommit -v
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed with exit code $LASTEXITCODE." }

      - name: Reverify signed tag before Store submission commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signerPath = Join-Path $env:RUNNER_TEMP 'release-allowed-signers'
          $trustedSigners = & git show 'refs/remotes/origin/main:.github/release-allowed-signers'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read trusted signers from origin/main.' }
          if (-not $trustedSigners -or [string]::IsNullOrWhiteSpace(($trustedSigners -join ''))) { throw 'Trusted signer list is empty.' }
          Set-Content -LiteralPath $signerPath -Value $trustedSigners -Encoding utf8NoBOM
          if (-not (Test-Path -LiteralPath $signerPath) -or (Get-Item -LiteralPath $signerPath).Length -eq 0) { throw 'Trusted signer list was not materialized.' }
          $verified = & .\packaging\verify-release-tag.ps1 -TagRef "refs/tags/$env:RELEASE_TAG" -ExpectedRevision $env:RELEASE_COMMIT -ExpectedTagObject $env:RELEASE_TAG_OBJECT -ExpectedTree $env:RELEASE_TREE -AllowedSignersPath $signerPath
          if (-not $?) { throw 'Signed release tag verification failed.' }
          $remoteLine = & git ls-remote origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the authoritative remote tag ref.' }
          $localTagObject = (& git rev-parse "refs/tags/$env:RELEASE_TAG").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the local named release tag.' }
          $remoteFields = @($remoteLine -split '\s+' | Where-Object { $_ })
          if ($remoteFields.Count -ne 2 -or $remoteFields[1] -cne "refs/tags/$env:RELEASE_TAG" -or $remoteFields[0] -cne $env:RELEASE_TAG_OBJECT -or $localTagObject -cne $env:RELEASE_TAG_OBJECT) {
            throw 'The local and authoritative remote release tag object do not match the frozen tag.'
          }

      - name: MSStore Commit Submission
        shell: pwsh
        env:
          STORE_PRODUCT_ID_NORMALIZED: ${{ steps.prereq.outputs.store_product_id }}
        run: |
          msstore submission publish $env:STORE_PRODUCT_ID_NORMALIZED
          if ($LASTEXITCODE -ne 0) { throw "msstore submission publish failed with exit code $LASTEXITCODE." }
